spring:
  application:
    name: etl-shadow-test
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    generator:
      write-bigdecimal-as-plain: true
    default-property-inclusion: always

# Metrics for Prometheus and Grafana (docs/monitoring.md). Actuator endpoints are outside /api/**, so they need no token.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Environment connections and credentials live here (service configuration), never in requests.
shadow:
  heartbeat-interval: 5s
  heartbeat-stale-after: 30s
  max-concurrent-runs: 2
  retry-after: 30s
  mismatch-sample-size: 100
  duckdb:
    temp-directory: ${java.io.tmpdir}/etl-shadow-test
    memory-limit: 1GB
    threads: 2
